<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Laboratorio de Rosa 3D — Verificación Anatómica</title>
  <style>
    :root {
      --bg: #09030a;
      --card-bg: rgba(22, 10, 26, 0.75);
      --accent: #d84174;
      --text: #f3e8ee;
      --text-muted: #b89cae;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }
    #canvas-lab {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 65, 116, 0.25);
      border-radius: 12px;
      padding: 14px 18px;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p.desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover, button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    input[type=range] {
      accent-color: var(--accent);
      width: 120px;
      cursor: pointer;
    }
    .stats {
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      margin-top: 8px;
      line-height: 1.5;
    }
    .stats span {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <canvas id="canvas-lab"></canvas>

  <div class="hud">
    <h1>🌹 Laboratorio Anatómico</h1>
    <p class="desc">Cáliz ovoide, 5 sépalos reflexos, filotaxia 144°, pétalos en cuchara y corazón en espiral.</p>

    <div class="control-row">
      <label>Modelo:</label>
      <div class="btn-group">
        <button id="mod-rosa" class="active">🌹 Rosa</button>
        <button id="mod-ramo">💐 Ramo 12</button>
      </div>
    </div>

    <div class="control-row">
      <label>Cámara:</label>
      <div class="btn-group">
        <button id="cam-cerca">Cerca</button>
        <button id="cam-media" class="active">Media</button>
        <button id="cam-lejos">Lejos</button>
        <button id="cam-cenital">Cenital</button>
      </div>
    </div>

    <div class="control-row">
      <label>Estado:</label>
      <div class="btn-group">
        <button id="btn-capullo">Capullo</button>
        <button id="btn-semi">Semi</button>
        <button id="btn-abierta" class="active">Abierta</button>
      </div>
    </div>

    <div class="control-row">
      <label for="apertura">Apertura:</label>
      <input type="range" id="apertura" min="0" max="1" step="0.01" value="1.0">
    </div>

    <div class="control-row">
      <label for="wireframe">Wireframe:</label>
      <button id="wireframe">Alternar</button>
    </div>

    <div class="control-row">
      <label for="rotacion">Giro:</label>
      <button id="rotacion" class="active">Pausar</button>
    </div>

    <div class="stats">
      Triángulos Flor: <span id="tri-count">~4,800</span><br>
      Draw Calls: <span id="draw-calls">2</span><br>
      Filotaxia: <span>144° (2/5)</span> | Sépalos: <span>5</span>
    </div>
  </div>

  <script type="module" src="/src/rose-lab.js"></script>
</body>
</html>
